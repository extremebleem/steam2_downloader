name: build and release

# Quoted: bare `on` is the boolean true in YAML 1.1, which trips up local linters.
"on":
  push:
    branches: [main]
    # A release is 46 MB built from a 13 TB catalog snapshot; documentation and screenshots cannot
    # change what it contains, so they do not earn one. apps/ has its own workflow and the app
    # fetches apps.json at runtime rather than embedding it, so neither belongs here either.
    # workflow_dispatch below still forces a build by hand whenever one is wanted anyway.
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'apps/**'
      - 'apps.json'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# Needed so the workflow can publish a release.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The snapshot used to be built here, from the mirrors, on every run. They have closed, so it
      # is committed instead and this only checks that it is there. Missing, it cannot be recreated
      # and the release would have no catalog at all, so that is a build failure rather than a note.
      - name: Check the catalog snapshot
        shell: pwsh
        run: |
          if (-not (Test-Path Steam2Browser/index.bin)) {
            throw 'Steam2Browser/index.bin is missing. It is the catalog and cannot be rebuilt: the mirrors it came from are gone.'
          }
          $mb = (Get-Item Steam2Browser/index.bin).Length / 1MB
          Write-Host ("embedding the catalog snapshot, {0:N2} MB" -f $mb)
          "SNAPSHOT=yes" | Out-File -Append $env:GITHUB_ENV

      # A plain publish: the executable with its runtime beside it, not a single file.
      #
      # The single-file build was a compressed bundle that unpacked itself into a temp
      # folder and ran from there. That is what a packer does, and to a heuristic engine
      # it reads as one - Kaspersky was deleting the release off machines as
      # UDS:Trojan.Win64.SBadur.gen, a cloud verdict on behaviour rather than a signature
      # on anything in the file. Ordinary software ships as a folder; so does this now.
      #
      # Version comes from the tag this run is about to publish, so the version resource
      # agrees with the release instead of reading 1.0.0.0 forever.
      - name: Publish Windows
        shell: pwsh
        run: |
          dotnet publish Steam2Browser/Steam2Browser.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishTrimmed=false `
            -p:DebugType=none `
            -p:Version=1.0.${{ github.run_number }} `
            -o publish/win-x64

      - name: Publish Linux
        shell: pwsh
        run: |
          dotnet publish Steam2Browser/Steam2Browser.csproj `
            -c Release -r linux-x64 --self-contained true `
            -p:PublishTrimmed=false `
            -p:DebugType=none `
            -p:Version=1.0.${{ github.run_number }} `
            -o publish/linux-x64

      # Same publish as above with a different RID. The .NET SDK cross-compiles this on the
      # Windows runner - the arm64 runtime arrives as a NuGet package - so no ARM hardware and
      # no second job are needed. This is what a Raspberry Pi or an arm64 VPS can actually run;
      # the linux-x64 build refuses to start there.
      - name: Publish Linux ARM64
        shell: pwsh
        run: |
          dotnet publish Steam2Browser/Steam2Browser.csproj `
            -c Release -r linux-arm64 --self-contained true `
            -p:PublishTrimmed=false `
            -p:DebugType=none `
            -p:Version=1.0.${{ github.run_number }} `
            -o publish/linux-arm64

      - name: Trim publish leftovers
        shell: pwsh
        # The UI and the depot key table are embedded in the exe, so the loose copies
        # ASP.NET emits are dead weight. web.config only matters under IIS.
        run: |
          foreach ($rid in 'win-x64', 'linux-x64', 'linux-arm64') {
            Remove-Item -Recurse -Force "publish/$rid/wwwroot" -ErrorAction SilentlyContinue
            Remove-Item -Force "publish/$rid/web.config" -ErrorAction SilentlyContinue
            Remove-Item -Force "publish/$rid/*.staticwebassets.endpoints.json" -ErrorAction SilentlyContinue
          }
          Get-ChildItem publish

      - name: Smoke test
        shell: pwsh
        # Catches a build that publishes but cannot start — the embedded UI failing to resolve
        # would otherwise only show up on a user's machine. The checks are structural on purpose:
        # an earlier version matched the window title and broke the moment the app was renamed.
        run: |
          $exe = Start-Process -FilePath publish/win-x64/steam2browser.exe `
            -ArgumentList '--no-browser','--port=5099' -PassThru

          $page = $null
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri http://127.0.0.1:5099/ -TimeoutSec 5 -UseBasicParsing
              if ($r.StatusCode -eq 200) { $page = $r.Content; break }
            } catch { }
          }

          $problems = @()
          if (-not $page) {
            $problems += 'the exe never answered on port 5099'
          } else {
            # The depot list and the script tag are the app, whatever it is called this week.
            if ($page -notmatch 'id="depotList"') { $problems += 'the page has no depot list' }
            if ($page -notmatch 'app\.js')        { $problems += 'the page does not load app.js' }

            # Assets are embedded resources in a single-file publish, which is the part most
            # likely to break without anyone noticing until launch.
            foreach ($asset in 'style.css', 'app.js') {
              try {
                $a = Invoke-WebRequest -Uri "http://127.0.0.1:5099/$asset" -TimeoutSec 5 -UseBasicParsing
                if ($a.StatusCode -ne 200 -or $a.RawContentLength -lt 100) {
                  $problems += "$asset came back empty or missing"
                }
              } catch {
                $problems += "$asset did not load"
              }
            }

            # Serving the page only proves the web host came up. These are the parts that can fail
            # on their own after that: an embedded catalog that does not load leaves an app with no
            # depots in it, and a torrent engine that throws on startup used to show up only as a
            # red status chip on someone's machine.
            try {
              $state = $null
              foreach ($i in 1..30) {
                $s = Invoke-RestMethod -Uri http://127.0.0.1:5099/api/state -TimeoutSec 5
                if ($s.status.ready) { $state = $s; break }
                Start-Sleep -Seconds 2
              }
              if (-not $state) {
                $problems += 'the index never finished loading'
              } elseif ($state.catalog.depots -lt 10000) {
                $problems += "the catalog holds only $($state.catalog.depots) depots"
              } else {
                Write-Host "index ready with $($state.catalog.depots) depots"
              }
              if ($state -and -not $state.disk.root) {
                $problems += 'free space could not be read for the download directory'
              }
            } catch {
              $problems += "/api/state did not answer: $_"
            }

            try {
              $seed = Invoke-RestMethod -Uri http://127.0.0.1:5099/api/seed -TimeoutSec 10
              if ($seed.state -eq 'error') { $problems += "sharing failed to start: $($seed.message)" }
              else { Write-Host "sharing reports '$($seed.state)'" }
            } catch {
              $problems += "/api/seed did not answer: $_"
            }
          }

          Stop-Process -Id $exe.Id -Force -ErrorAction SilentlyContinue

          if ($problems.Count) { throw ($problems -join '; ') }
          Write-Host 'served the page, style.css and app.js'

      - name: Package
        shell: pwsh
        run: |
          # The smoke test runs the executable from inside publish/win-x64, and the app writes its
          # working directory next to itself. Left in place it ships: tens of megabytes of index
          # the release already embeds, the engine's cached torrent metadata, and a settings.json
          # naming absolute paths on the runner - which is the one that would actually hurt, since
          # a downloaded settings file pointing at D:\a\steam2_downloader is how you get an app
          # insisting its archive lives somewhere that does not exist.
          foreach ($rid in 'win-x64', 'linux-x64', 'linux-arm64') {
            if (Test-Path "publish/$rid/steam2info") {
              $n = (Get-ChildItem "publish/$rid/steam2info" -Recurse -File).Count
              Remove-Item -Recurse -Force "publish/$rid/steam2info"
              Write-Host "removed $n file(s) the smoke test left in publish/$rid"
            }
          }

          Copy-Item README.md publish/win-x64/
          Copy-Item README.md publish/linux-x64/
          Copy-Item README.md publish/linux-arm64/
          Compress-Archive -Path publish/win-x64/* -DestinationPath steam2browser-win-x64.zip -Force
          Compress-Archive -Path publish/linux-x64/* -DestinationPath steam2browser-linux-x64.zip -Force
          Compress-Archive -Path publish/linux-arm64/* -DestinationPath steam2browser-linux-arm64.zip -Force
          Get-Item steam2browser-win-x64.zip, steam2browser-linux-x64.zip, steam2browser-linux-arm64.zip |
            Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: steam2browser-packages
          path: |
            steam2browser-win-x64.zip
            steam2browser-linux-x64.zip
            steam2browser-linux-arm64.zip

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # The app checks for updates by comparing its build stamp against the newest commit
        # time on main, so every push to main gets a build that carries that commit's date.
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          $sha = "${{ github.sha }}".Substring(0,7)
          $notes = @"
          Built from commit $sha.

          Windows: download ``steam2browser-win-x64.zip``, unzip, and run ``steam2browser.exe``.
          Linux: download ``steam2browser-linux-x64.zip``, unzip, run ``chmod +x steam2browser``
          once, then run ``./steam2browser``. On arm64 (Raspberry Pi, arm64 VPS) take
          ``steam2browser-linux-arm64.zip`` instead. All three are self-contained; no .NET
          install is needed.
          Everything the app writes goes to ``steam2info/`` next to the executable.
          "@
          gh release create $tag steam2browser-win-x64.zip steam2browser-linux-x64.zip `
            steam2browser-linux-arm64.zip `
            --title $tag `
            --notes $notes `
            --target ${{ github.sha }}
